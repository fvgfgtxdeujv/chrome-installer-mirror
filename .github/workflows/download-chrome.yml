name: Download and Upload Chrome.exe (Version Increment)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 获取最新 Chrome 版本号
        id: latest
        run: |
          VERSION=$(curl -s https://versionhistory.googleapis.com/v1/chrome/platforms/win64/channels/stable/versions | jq -r '.versions[0].version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "最新版: $VERSION"

      - name: 获取当前已发布的最新 Release 版本
        id: current
        run: |
          CURRENT=$(gh release list --limit 100 --repo ${{ github.repository }} | grep -oP 'chrome-v\K[\d.]+' | sort -V | tail -n1)
          if [ -z "$CURRENT" ]; then
            CURRENT="0.0.0.0"
          fi
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          echo "当前已发布: $CURRENT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 版本比较
        id: compare
        run: |
          LATEST="${{ steps.latest.outputs.version }}"
          CURRENT="${{ steps.current.outputs.current }}"
          
          if [ "$(echo -e "$CURRENT\n$LATEST" | sort -V | tail -n1)" == "$CURRENT" ] && [ "$CURRENT" != "$LATEST" ]; then
            echo "⚠️ 当前已是最新，跳过下载"
            echo "should_run=false" >> $GITHUB_OUTPUT
          else
            echo "✅ 发现新版本: $LATEST (当前: $CURRENT)"
            echo "should_run=true" >> $GITHUB_OUTPUT
          fi

      - name: 下载 Chrome.exe（带重试）
        if: steps.compare.outputs.should_run == 'true'
        run: |
          for i in {1..3}; do
            echo "尝试第 $i 次下载..."
            curl -L -o chrome_installer.exe \
              --retry 3 \
              --retry-delay 2 \
              --max-time 300 \
              https://dl.google.com/tag/s/appguid%3D%7B8A69D345-D564-463C-AFF1-A69D9E530F96%7D/update2/installers/ChromeStandaloneSetup.exe
            
            if [ -f chrome_installer.exe ] && [ -s chrome_installer.exe ]; then
              echo "下载成功"
              break
            else
              echo "下载失败，重试中..."
              rm -f chrome_installer.exe
              sleep 3
            fi
          done

      - name: 🔍 文件完整性检查 + 生成 SHA256
        if: steps.compare.outputs.should_run == 'true'
        id: verify
        run: |
          FILE="chrome_installer.exe"
          
          if [ ! -f "$FILE" ]; then
            echo "❌ 文件不存在"
            exit 1
          fi
          
          SIZE=$(stat -c%s "$FILE")
          MIN_SIZE=60000000
          MAX_SIZE=100000000
          
          echo "文件大小: $SIZE 字节"
          
          if [ $SIZE -lt $MIN_SIZE ] || [ $SIZE -gt $MAX_SIZE ]; then
            echo "❌ 文件大小异常: $SIZE"
            exit 1
          fi
          
          FILETYPE=$(file "$FILE")
          if echo "$FILETYPE" | grep -q "PE32"; then
            echo "✅ 文件类型校验通过"
          else
            echo "❌ 文件类型异常: $FILETYPE"
            exit 1
          fi
          
          SHA256=$(sha256sum "$FILE" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "✅ SHA256: $SHA256"
          
          echo "$SHA256  $FILE" > chrome_installer.exe.sha256
          echo "✅ 校验文件已生成: chrome_installer.exe.sha256"

      - name: 🗑️ 删除上一个 Release（保留最新版）
        if: steps.compare.outputs.should_run == 'true' && steps.verify.outcome == 'success'
        run: |
          OLD_RELEASE=$(gh release list --limit 10 --repo ${{ github.repository }} \
            | grep -E 'chrome-v[0-9]' \
            | sort -V -k2 \
            | tail -n1 \
            | awk '{print $1}')
          
          if [ -n "$OLD_RELEASE" ]; then
            echo "🗑️ 删除旧 Release: $OLD_RELEASE"
            gh release delete "$OLD_RELEASE" --repo ${{ github.repository }} --yes
          else
            echo "ℹ️ 没有旧 Release 需要删除"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建 Release 并上传（exe + sha256）
        if: steps.compare.outputs.should_run == 'true' && steps.verify.outcome == 'success'
        run: |
          TAG="chrome-v${{ steps.latest.outputs.version }}"
          
          gh release create $TAG \
            chrome_installer.exe \
            chrome_installer.exe.sha256 \
            --title "Chrome ${{ steps.latest.outputs.version }}" \
            --notes "📦 **Chrome 自动更新包**
          
          | 项目 | 内容 |
          |------|------|
          | **版本** | ${{ steps.latest.outputs.version }} |
          | **SHA256** | \`${{ steps.verify.outputs.sha256 }}\` |
          | **文件大小** | $(stat -c%s chrome_installer.exe) 字节 |
          | **构建时间** | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |
          
          ---
          
          ### 🔐 校验方法（Windows）
          ```powershell
          Get-FileHash .\chrome_installer.exe -Algorithm SHA256
          ```
          
          ### 🔐 校验方法（Linux/Mac）
          ```bash
          sha256sum chrome_installer.exe
          sha256sum -c chrome_installer.exe.sha256
          ```" \
            --repo ${{ github.repository }}
          
          echo "✅ Release 创建成功: $TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚨 校验失败告警
        if: steps.compare.outputs.should_run == 'true' && steps.verify.outcome == 'failure'
        run: |
          echo "::error::文件完整性校验失败，请手动检查！"
          exit 1
