name: Download and Upload Chrome.exe (Version Increment)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 获取最新 Chrome 版本号
        id: latest
        run: |
          set -e
          VERSION=$(curl -s https://versionhistory.googleapis.com/v1/chrome/platforms/win64/channels/stable/versions \
            | jq -r '.versions[0].version')
          if [ -z "$VERSION" ] || [ "$VERSION" == "null" ]; then
            echo "::error::无法获取最新 Chrome 版本号"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "最新版: $VERSION"

      - name: 获取当前已发布的最新 Release 版本
        id: current
        run: |
          set -e
          CURRENT=$(gh release list --limit 100 --repo ${{ github.repository }} \
            --json tagName -q '.[].tagName' \
            | grep -oP '^chrome-v\K[\d.]+' \
            | sort -V | tail -n1 || true)
          if [ -z "$CURRENT" ]; then
            CURRENT="0.0.0.0"
          fi
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "当前已发布: $CURRENT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 版本比较
        id: compare
        run: |
          set -e
          LATEST="${{ steps.latest.outputs.version }}"
          CURRENT="${{ steps.current.outputs.current }}"

          if [ "$CURRENT" == "$LATEST" ]; then
            echo "⚠️ 当前已是最新 ($CURRENT)，跳过下载"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ 发现新版本: $LATEST (当前: $CURRENT)"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 下载 Chrome.exe（带重试）
        if: steps.compare.outputs.should_run == 'true'
        run: |
          set -e
          OK=0
          for i in 1 2 3; do
            echo "尝试第 $i 次下载..."
            if curl -L -o chrome_installer.exe \
              --retry 3 \
              --retry-delay 2 \
              --max-time 300 \
              "https://dl.google.com/tag/s/appguid%3D%7B8A69D345-D564-463C-AFF1-A69D9E530F96%7D/update2/installers/ChromeStandaloneSetup.exe"; then
              if [ -s chrome_installer.exe ]; then
                echo "✅ 下载成功"
                OK=1
                break
              fi
            fi
            echo "❌ 下载失败，重试中..."
            rm -f chrome_installer.exe
            sleep 3
          done

          if [ "$OK" -ne 1 ]; then
            echo "::error::下载失败，已重试 3 次"
            exit 1
          fi

      - name: 🔍 文件完整性检查 + 生成 SHA256
        if: steps.compare.outputs.should_run == 'true'
        id: verify
        run: |
          set -e
          FILE="chrome_installer.exe"

          if [ ! -f "$FILE" ]; then
            echo "::error::文件不存在"
            exit 1
          fi

          FILETYPE=$(file "$FILE")
          if echo "$FILETYPE" | grep -q "PE32"; then
            echo "✅ 文件类型校验通过"
          else
            echo "::error::文件类型异常: $FILETYPE"
            exit 1
          fi

          SHA256=$(sha256sum "$FILE" | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "✅ SHA256: $SHA256"

          VERSION="${{ steps.latest.outputs.version }}"
          echo "$SHA256  chrome_${VERSION}.exe" > "chrome_${VERSION}.exe.sha256"
          echo "✅ 校验文件已生成: chrome_${VERSION}.exe.sha256"

      - name: 重命名文件为带版本号
        if: steps.compare.outputs.should_run == 'true' && steps.verify.outcome == 'success'
        run: |
          set -e
          VERSION="${{ steps.latest.outputs.version }}"
          mv chrome_installer.exe "chrome_${VERSION}.exe"
          echo "✅ 重命名为: chrome_${VERSION}.exe"

      - name: 🗑️ 删除旧 Release（只保留当前版本）
        if: steps.compare.outputs.should_run == 'true' && steps.verify.outcome == 'success'
        run: |
          set -e
          CURRENT_TAG="chrome-v${{ steps.latest.outputs.version }}"
          echo "当前版本 Tag: $CURRENT_TAG"

          OLD_TAGS=$(gh release list --limit 100 --repo ${{ github.repository }} \
            --json tagName -q '.[].tagName' \
            | grep '^chrome-v' | grep -v "^${CURRENT_TAG}$" || true)

          if [ -z "$OLD_TAGS" ]; then
            echo "ℹ️ 没有旧 Release 需要删除"
            exit 0
          fi

          echo "$OLD_TAGS" | while read -r OLD_TAG; do
            [ -z "$OLD_TAG" ] && continue
            echo "🗑️ 删除旧 Release: $OLD_TAG"
            gh release delete "$OLD_TAG" \
              --repo ${{ github.repository }} \
              --yes \
              --cleanup-tag
            echo "✅ 删除成功: $OLD_TAG"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 创建 Release 并上传（带版本号）
        if: steps.compare.outputs.should_run == 'true' && steps.verify.outcome == 'success'
        run: |
          set -e
          VERSION="${{ steps.latest.outputs.version }}"
          TAG="chrome-v${VERSION}"
          SHA="${{ steps.verify.outputs.sha256 }}"
          FILESIZE=$(stat -c%s "chrome_${VERSION}.exe")
          BUILDTIME=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          # 如果 tag 已存在（比如上次失败残留），先删除
          if gh release view "$TAG" --repo ${{ github.repository }} >/dev/null 2>&1; then
            echo "⚠️ Release $TAG 已存在，先删除"
            gh release delete "$TAG" --repo ${{ github.repository }} --yes --cleanup-tag
          fi

          NOTES=$(cat <<EOF
          📦 **Chrome 自动更新包**

          | 项目 | 内容 |
          |------|------|
          | **版本** | ${VERSION} |
          | **SHA256** | \`${SHA}\` |
          | **文件大小** | ${FILESIZE} 字节 |
          | **构建时间** | ${BUILDTIME} |

          ---

          ### 🔐 校验方法（Windows）
          \`\`\`powershell
          Get-FileHash .\\chrome_${VERSION}.exe -Algorithm SHA256
          \`\`\`

          ### 🔐 校验方法（Linux/Mac）
          \`\`\`bash
          sha256sum chrome_${VERSION}.exe
          sha256sum -c chrome_${VERSION}.exe.sha256
          \`\`\`
          EOF
          )

          gh release create "$TAG" \
            "chrome_${VERSION}.exe" \
            "chrome_${VERSION}.exe.sha256" \
            --title "Chrome ${VERSION}" \
            --notes "$NOTES" \
            --repo ${{ github.repository }}

          echo "✅ Release 创建成功: $TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 安装 Python 依赖 (WebDAV)
        if: steps.compare.outputs.should_run == 'true' && steps.verify.outcome == 'success'
        run: |
          set -e
          echo "📦 安装 webdavclient3..."
          python3 -m pip install --upgrade pip
          python3 -m pip install webdavclient3

          echo "🔍 验证安装..."
          if python3 -c "import webdav3.client" 2>/dev/null; then
            echo "✅ webdavclient3 安装成功"
          else
            echo "::error::webdavclient3 安装失败，终止流程"
            exit 1
          fi

      - name: 📤 上传到 WebDAV
        if: steps.compare.outputs.should_run == 'true' && steps.verify.outcome == 'success'
        run: |
          set -e
          if [ -z "${{ secrets.WEBDAV_URL }}" ] || \
             [ -z "${{ secrets.WEBDAV_USERNAME }}" ] || \
             [ -z "${{ secrets.WEBDAV_PASSWORD }}" ]; then
            echo "⚠️ WebDAV 配置不完整，跳过上传"
            exit 0
          fi

          export PYTHONPATH="$HOME/.local/lib/python3.12/site-packages:$PYTHONPATH"
          export WEBDAV_URL="${{ secrets.WEBDAV_URL }}"
          export WEBDAV_USERNAME="${{ secrets.WEBDAV_USERNAME }}"
          export WEBDAV_PASSWORD="${{ secrets.WEBDAV_PASSWORD }}"
          export VERSION="${{ steps.latest.outputs.version }}"

          echo "🚀 开始上传到 WebDAV..."
          python3 webdav_upload.py
        shell: bash

      - name: 🚨 校验失败告警
        if: steps.compare.outputs.should_run == 'true' && steps.verify.outcome == 'failure'
        run: |
          echo "::error::文件完整性校验失败，请手动检查！"
          exit 1
